[project]
name = "cmc-87708-repro"
version = "0.1.0"
description = "Reproducibility code for CMC manuscript 87708"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "pyarrow>=18.0",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "tqdm>=4.66",
  "transformers>=4.44",
  "torch>=2.1",
  "nltk>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
